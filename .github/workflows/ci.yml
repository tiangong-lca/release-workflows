name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24.22.0 and pnpm 11.24.0
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.24.0
          runtime: node@24.22.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install qualified Result archive tool
        run: |
          mkdir -p "$RUNNER_TEMP/result-7zip"
          curl --fail --location --retry 3 https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz -o "$RUNNER_TEMP/result-7zip/tool.tar.xz"
          echo "22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e  $RUNNER_TEMP/result-7zip/tool.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/result-7zip/tool.tar.xz" -C "$RUNNER_TEMP/result-7zip"
          echo "RELEASE_7ZIP_BIN=$RUNNER_TEMP/result-7zip/7zz" >> "$GITHUB_ENV"

      - name: Validate workflow documentation baseline
        run: pnpm run prepush:gate

  native-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node and pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.24.0
          runtime: node@24.22.0
          install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build Release encoder
        run: pnpm run native:check && pnpm run native:build
      - name: Verify final-result files with independent expected values
        run: node --test workflows/release-candidate/test/final-result-projection.test.mjs workflows/release-candidate/test/final-result-artifacts.test.mjs
