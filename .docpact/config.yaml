version: 1
layout: repo
lastReviewedAt: "2026-09-13"
lastReviewedCommit: "ba2c97947a9be5d9e99e473963e7fbf6efbdf8b1"
lastReviewedNote: "Release #72: canonicalRepo migrated to tiangong-lca/release-workflows and AGENTS branch facts corrected against live GitHub evidence (feature/issue-59 deleted, tracking issue closed); public visibility and workflow contracts unchanged."

catalog:
  repos:
    - id: release
      path: .
      canonicalRepo: tiangong-lca/release-workflows
      entryDoc: AGENTS.md
      workflowDocs:
        - README.md
        - workflows/README.md
        - docs/architecture.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-docs-and-automation
      paths:
        include:
          - AGENTS.md
          - README.md
          - docs/**
          - .docpact/**
          - .gitignore
          - .env.example
          - package.json
          - pnpm-workspace.yaml
          - pnpm-lock.yaml
          - .node-version
          - test/**
          - .github/workflows/ci.yml
      ownerRepo: release
    - id: shared-workflow-contract
      paths:
        include:
          - workflows/README.md
          - workflows/AGENTS.md
      ownerRepo: release
    - id: calculation-workflow
      paths:
        include:
          - workflows/calculation/**
      ownerRepo: release
    - id: dataset-transformation-workflow
      paths:
        include:
          - workflows/dataset-transformation/**
      ownerRepo: release
    - id: result-materialization-workflow
      paths:
        include:
          - workflows/result-materialization/**
      ownerRepo: release
    - id: release-candidate-workflow
      paths:
        include:
          - workflows/release-candidate/**
      ownerRepo: release
    - id: publication-workflow
      paths:
        include:
          - workflows/publication/**
      ownerRepo: release

coverage:
  include:
    - AGENTS.md
    - README.md
    - docs/**
    - .docpact/**
    - .gitignore
    - .env.example
    - .node-version
    - test/**
    - workflows/**
    - package.json
    - pnpm-workspace.yaml
    - .github/workflows/ci.yml
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - .release/**
    - pnpm-lock.yaml
    - "*.log"

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    calculation-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/calculation/**
        - README.md
    dataset-transformation-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/dataset-transformation/**
        - README.md
    result-materialization-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/result-materialization/**
        - README.md
    release-candidate-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/release-candidate/**
        - README.md
    publication-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/publication/**
        - README.md
    validation-and-automation:
      paths:
        - package.json
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
        - .node-version
        - test/**
        - .github/workflows/ci.yml
        - .docpact/config.yaml
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - docs/**
        - .docpact/**
        - .env.example
        - workflows/**
    root-integration:
      paths:
        - AGENTS.md
        - .docpact/config.yaml
        - docs/architecture.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/architecture.md
    - workflows/README.md
    - workflows/AGENTS.md
    - workflows/**/README.md
    - workflows/**/AGENTS.md

repo:
  id: release
  owner: release

rules:
  - id: release-bootstrap-contract
    scope: repo
    repo: release
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/architecture.md
        kind: architecture
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: workflows/README.md
        mode: review_or_update
      - path: workflows/AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
    reason: Repository guidance, workflow navigation, machine-readable routing, and architecture must stay aligned.
  - id: release-landing-contract
    scope: repo
    repo: release
    triggers:
      - path: README.md
        kind: repo-landing
      - path: .env.example
        kind: operator-env-template
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: User-facing purpose, current status, and security guidance must match the repository contract.
  - id: release-workflow-shared-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/README.md
        kind: workflow-index
      - path: workflows/AGENTS.md
        kind: workflow-shared-contract
    requiredDocs:
      - path: workflows/README.md
        mode: review_or_update
      - path: workflows/AGENTS.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Shared workflow navigation and Agent rules must remain aligned with the repository contract and architecture.
  - id: calculation-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/calculation/**
        kind: calculation-workflow
    requiredDocs:
      - path: workflows/calculation/AGENTS.md
        mode: review_or_update
      - path: workflows/calculation/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Calculation entry, validation, remote task, download, evidence, and recovery behavior must stay coherent.
  - id: dataset-transformation-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/dataset-transformation/**
        kind: dataset-transformation-workflow
    requiredDocs:
      - path: workflows/dataset-transformation/AGENTS.md
        mode: review_or_update
      - path: workflows/dataset-transformation/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Candidate-bound DSL, semantic decision handling, deterministic transformation, validation, and return paths must stay coherent.
  - id: result-materialization-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/result-materialization/**
        kind: result-materialization-workflow
    requiredDocs:
      - path: workflows/result-materialization/AGENTS.md
        mode: review_or_update
      - path: workflows/result-materialization/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Result Process, LifecycleModel, identity/version planning, canonical dataset output, and validation behavior must stay coherent.
  - id: release-candidate-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/release-candidate/**
        kind: release-candidate-workflow
    requiredDocs:
      - path: workflows/release-candidate/AGENTS.md
        mode: review_or_update
      - path: workflows/release-candidate/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Candidate intake, package planning, validation-failure repair, Publication handoff, and immutable Candidate behavior must stay coherent.
  - id: publication-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/publication/**
        kind: publication-workflow
    requiredDocs:
      - path: workflows/publication/AGENTS.md
        mode: review_or_update
      - path: workflows/publication/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Candidate-bound scope planning, exact payload, target inspection, authorization, resumable remote mutation, and independent readback must stay coherent.
  - id: release-validation-contract
    scope: repo
    repo: release
    triggers:
      - path: .gitignore
        kind: generated-runtime-exclusion
      - path: package.json
        kind: build-contract
      - path: pnpm-workspace.yaml
        kind: workspace-contract
      - path: pnpm-lock.yaml
        kind: dependency-lock
      - path: .node-version
        kind: runtime-pin
      - path: test/**
        kind: repository-validation-contract
      - path: .github/workflows/ci.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
    reason: The exact runtime, effective pnpm workspace policy, dependency lock, documentation baseline, and repository-level validation entrypoints must stay aligned.
